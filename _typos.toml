
[files]
extend-exclude = [
  "packages/r-msaview/inst/htmlwidgets/lib/",
  # phylogenetic trees + the demo config are full of UCSC species db ids
  # (panTro4, HLturTru4, ...) and gene symbols (CHEK1, LIMK1, MAK, ...) that
  # the spell checker reads as typos
  "*.nh",
  "*.nwk",
  # generated from git history: abbreviated commit hashes read as words
  "CHANGELOG.md",
  # aligned protein sequence: runs of one-letter codes that the checker reads as
  # words (THN as THEN, and so on down the alphabet)
  "*.afa",
  "packages/app/public/data/jbrowse-msa-combined-config.json",
  # gene symbols and UniProt accessions read as typos (CHEK1, LIMK1, MAK,
  # Q8IY84, ...)
  "packages/app/public/data/kinase-pocket/kinase-pocket-metadata.json",
]

[default.extend-words]
BLOSUM = "BLOSUM"
# synteny term: conserved gene order across genomes (not geometric "collinear")
colinear = "colinear"
Pase = "Pase"
# UCSC species db names in comments, e.g. panTro4 (chimp)
Tro = "Tro"
# prose abbreviations the checker mis-reads (IIFEs, PNGs, ALS the disease)
IIF = "IIF"
PN = "PN"
ALS = "ALS"
# gene names the checker reads as misspellings: Wnt (Wingless/Int-1 ligand
# family) and CONSTANS (the Arabidopsis flowering-time gene, symbol CO)
Wnt = "Wnt"
CONSTANS = "CONSTANS"
# amino acid three-letter codes: the PDB/ClinVar tables in scripts/examples-gen
# and the Pfam domain name Ser-Thr/Tyr_kinase_cat_dom
SER = "SER"
THR = "THR"
Ser = "Ser"
Thr = "Thr"
# gene name: the ABL1/ABL2 kinases (Abelson murine leukemia), read as a
# truncated "able"
ABL = "ABL"
Abl = "Abl"
abl = "abl"

# the four-letter species prefix the RNA tutorial's row names carry for
# Clostridium acetobutylicum
Cace = "Cace"
