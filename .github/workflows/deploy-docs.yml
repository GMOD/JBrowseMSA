name: Deploy docs site

# Builds the docs website (gmod.org/JBrowseMSA) with the demo app at /demo and
# publishes it via GitHub's native Pages deployment (no gh-pages branch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# allow one concurrent deploy; let an in-progress run finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          # setup-node v5 auto-caches based on the packageManager field, but
          # that runs pnpm before Corepack has provisioned it; disable it here.
          package-manager-cache: false

      # Corepack pins pnpm to the packageManager field in package.json; run it
      # after setup-node so node lives in the user-owned toolcache and no sudo
      # is needed. Replaces pnpm/action-setup.
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Build pages bundle (docs + /demo app)
        run: pnpm build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
