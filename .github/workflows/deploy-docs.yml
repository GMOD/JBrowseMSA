name: Deploy docs site

# Builds the docs website (gmod.org/JBrowseMSA) with the demo app at /demo,
# checks its links, and publishes it via GitHub's native Pages deployment (no
# gh-pages branch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# allow one concurrent deploy; let an in-progress run finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Build pages bundle (docs + /demo app)
        run: pnpm build:pages

      # The site is served under /JBrowseMSA, so stage it at that path before
      # checking — otherwise the absolute /JBrowseMSA/... links won't resolve.
      # This runs on the bundle about to deploy, so a broken link stops the
      # deploy instead of being found in a job that built the site a second time.
      - name: Stage site under its base path
        run: |
          mkdir -p _linkcheck/JBrowseMSA
          cp -r pages-dist/. _linkcheck/JBrowseMSA/

      - name: Check internal links and anchors
        uses: untitaker/hyperlink@0.3.2
        with:
          # the action already passes --github-actions; don't repeat it here
          args: _linkcheck/ --check-anchors

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
