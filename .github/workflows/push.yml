name: CI

on: push

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          # pnpm is provisioned by Corepack below, after this step
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm build

      - name: Build app
        run: pnpm --filter app build

      - name: Build CLI
        run: pnpm --filter react-msaview-cli build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          # pnpm is provisioned by Corepack below, after this step
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  spellcheck:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: crate-ci/typos@master

  r-package:
    name: R package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # the widget's JavaScript is vendored into inst/, so a release that
      # skipped scripts/sync-r-bundle.mjs would ship stale JS to R users
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false
      - name: Check the vendored UMD bundle is current
        run: node scripts/sync-r-bundle.mjs --check

      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/r-msaview
          extra-packages: any::testthat, any::ape
      - name: Run tests
        run: Rscript -e "testthat::test_package('msaviewr')"
        working-directory: packages/r-msaview

  attw:
    name: Check types (attw)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          # pnpm is provisioned by Corepack below, after this step
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build:lib

      - name: Check types with attw
        run: pnpm attw

  link-check:
    name: Check docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          # pnpm is provisioned by Corepack below, after this step
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Build pages bundle (docs + /demo app)
        run: pnpm build:pages

      # The site is served under /JBrowseMSA, so stage it at that path before
      # checking — otherwise the absolute /JBrowseMSA/... links won't resolve.
      - name: Stage site under its base path
        run: |
          mkdir -p _linkcheck/JBrowseMSA
          cp -r pages-dist/. _linkcheck/JBrowseMSA/

      - name: Check internal links and anchors
        uses: untitaker/hyperlink@0.3.2
        with:
          # the action already passes --github-actions; don't repeat it here
          args: _linkcheck/ --check-anchors
